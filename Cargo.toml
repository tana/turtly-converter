[package]
name = "turtly-converter"
version = "0.1.0"
edition = "2021"
authors = ["Satoshi Tanaka <overthere555@gmail.com>"]
license = "MPL-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release]
debug = true

[features]
mkl = ["candle-core/mkl", "candle-nn/mkl"]

[dependencies]
anyhow = "1.0.75"
candle-core = "0.9.1"
candle-nn = "0.9.1"
clap = { version = "4.4.7", features = ["derive"] }
colorous = "1.0.16"
env_logger = "0.11.8"
indicatif = "0.18.0"
log = "0.4.27"
nalgebra = { version = "0.34.0", features = ["serde-serialize"] }
nom = "7.1.3"
ply-rs-bw = "2.0.2"
rand = "0.9.2"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.134"
stl_io = "0.7.0"

[dev-dependencies]
approx = "0.5.1"
